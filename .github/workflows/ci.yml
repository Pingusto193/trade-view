name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build do PWA
        run: pnpm --filter @radar/web build

  reference:
    name: Indicadores × referência pandas (regerada no CI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pip install pandas numpy
      - run: pnpm install --frozen-lockfile
      - name: Regera candles sintéticos e valores de referência com o pandas do CI
        run: |
          python tools/reference/generate_candles.py
          python tools/reference/indicators_reference.py
      - name: TypeScript precisa bater com a referência regerada (tolerância 1e-9)
        run: pnpm vitest run packages/core/test/indicators.reference.test.ts

  e2e:
    name: E2E (Playwright, dados simulados)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @radar/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/

  docker:
    name: Imagem de produção (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Monta a imagem
        run: docker build -t radar:ci .
      - name: Sobe em modo produção e confere saúde e PWA
        run: |
          docker run -d --name radar -p 8787:8787 -e PUBLIC_URL=http://localhost:8787 -e RADAR_SIMULATED=0 radar:ci
          for i in $(seq 1 40); do curl -sf localhost:8787/api/health && break; sleep 2; done
          curl -sf localhost:8787/api/health | grep '"simulated":false'
          curl -sf localhost:8787/ | grep -q '<html lang="pt-BR">'
          docker exec radar ls /data/radar.sqlite /data/app-secret.key /data/vapid.json
      - name: Simulador é proibido em produção
        run: |
          docker run --name sim -e RADAR_SIMULATED=1 radar:ci || true
          docker logs sim 2>&1 | grep -q 'RADAR_SIMULATED não pode ser ligado em produção'
