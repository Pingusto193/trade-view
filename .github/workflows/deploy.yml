name: Publicação (instalador)

# Testa de verdade o caminho de publicação (docs/GUIA_ORACLE.md): o instalador num Ubuntu com Docker,
# HTTPS pelo Caddy, o código de instalação da primeira conta e a imagem para ARM (Oracle grátis).
on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'
      - 'apps/server/src/auth/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    name: Instalador no Ubuntu (x86) com HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: Instalar (como na Oracle, mas com o domínio localhost)
        run: >
          sudo bash deploy/instalar.sh --dominio localhost --pasta "$GITHUB_WORKSPACE"
          --sem-baixar --sem-firewall --sem-esperar-https
      - name: Conferir HTTPS, saúde e o código de instalação
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsSk https://localhost/api/health && break
            sleep 2
          done
          curl -fsSk https://localhost/api/health | grep -q '"ok"'
          curl -fsSk https://localhost/api/auth/state | tee /dev/stderr | grep -q '"setupCodeRequired":true'
          code=$(sudo grep '^SETUP_CODE=' .env | cut -d= -f2)
          test ${#code} -eq 10
          h=(-H 'content-type: application/json' -H 'x-radar-client: ci' -H 'origin: https://localhost')
          st=$(curl -sk -o /dev/null -w '%{http_code}' "${h[@]}" https://localhost/api/auth/register \
            -d '{"email":"eu@exemplo.com","password":"senha-bem-longa-123","setupCode":"errado"}')
          test "$st" = 403
          st=$(curl -sk -o /dev/null -w '%{http_code}' "${h[@]}" https://localhost/api/auth/register \
            -d "{\"email\":\"eu@exemplo.com\",\"password\":\"senha-bem-longa-123\",\"setupCode\":\"$code\"}")
          test "$st" = 200
          # o PWA é servido pelo mesmo endereço
          curl -fsSk https://localhost/ | grep -qi '<html'
      - name: Rodar o instalador de novo não estraga nada (mesmo código, dados mantidos)
        run: |
          set -euo pipefail
          before=$(sudo grep '^SETUP_CODE=' .env)
          sudo bash deploy/instalar.sh --dominio localhost --pasta "$GITHUB_WORKSPACE" \
            --sem-baixar --sem-firewall --sem-esperar-https
          test "$before" = "$(sudo grep '^SETUP_CODE=' .env)"
          curl -fsSk https://localhost/api/auth/state | grep -q '"needsSetup":false'
      - name: Backup do atualizador
        run: sudo docker compose exec -T radar ./node_modules/.bin/tsx src/cli/backup.ts
      - name: Logs (se falhar)
        if: failure()
        run: sudo docker compose logs --tail 200

  arm64:
    name: Imagem ARM64 (Oracle A1) liga e responde
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Montar para linux/arm64
        run: docker buildx build --platform linux/arm64 -t radar:arm64 --load .
      - name: Ligar emulado e conferir a saúde (SQLite e argon2 nativos no ARM)
        run: |
          set -euo pipefail
          docker run -d --name radar --platform linux/arm64 -e NODE_ENV=production \
            -e SETUP_CODE=teste -e PUBLIC_URL=https://exemplo.invalid radar:arm64
          for i in $(seq 1 90); do
            if docker exec radar node -e "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker exec radar node -e "console.log(process.arch)"
              exit 0
            fi
            sleep 5
          done
          docker logs radar
          exit 1
