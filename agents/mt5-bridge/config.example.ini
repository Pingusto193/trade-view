; Configuração do agente MT5 do Radar. Copie este arquivo para "config.ini" (na mesma pasta) e preencha.
; NUNCA coloque aqui a senha da corretora: o agente usa o MetaTrader 5 que já está aberto e logado.
; O config.ini guarda o token do agente — não mande para ninguém (ele não é publicado no Git).

[radar]
; Endereço do seu Radar, com https:// (o mesmo que você abre no navegador).
url = https://radar.seudominio.com.br
; Token gerado no Radar em Mais → Fontes de dados → "Gerar token para um agente".
token = cole-aqui-o-token-gerado-no-radar

[mt5]
; Ativos, separados por vírgula, com o nome EXATO da Observação de Mercado do seu MT5.
; Exemplos na B3: WIN$N, WDO$N, PETR4, VALE3. No forex: EURUSD, GBPUSD, USDJPY (algumas corretoras
; usam sufixos, como EURUSD.a).
symbols = WIN$N, WDO$N, PETR4

; Mercado dos ativos: auto (o Radar descobre), b3 ou forex. Para trocar só alguns, use [mercados].
market = auto

; Fuso do relógio do servidor da corretora. "auto" mede pelos ticks com o mercado aberto.
; Outras opções: NY+7 (muitas corretoras de forex), America/Sao_Paulo (B3), UTC, UTC+02:00.
server_timezone = auto

; Caminho do terminal64.exe se você tiver mais de um MT5 instalado (vazio = o MT5 aberto).
terminal_path =

; De quantos em quantos segundos o agente consulta o MT5 (0,5 a 60).
poll_seconds = 1

[mercados]
; Opcional: mercado de um ativo específico, ex.:
; XAUUSD = forex
